apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: node-js-app-1-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR_GITHUB_ORG/platform-gitops.git
    targetRevision: main
    path: nodejs-app/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
