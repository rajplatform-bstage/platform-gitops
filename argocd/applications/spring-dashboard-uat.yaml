apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spring-dashboard-uat
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR_GITHUB_ORG/platform-gitops.git
    targetRevision: main
    path: springboot-app/overlays/uat
  destination:
    server: https://kubernetes.default.svc
    namespace: uat
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
