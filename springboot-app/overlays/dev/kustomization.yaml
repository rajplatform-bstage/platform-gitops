apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dev
resources:
  - ../../base
images:
  - name: DOCKERHUB_USERNAME/spring-dashboard
    newName: DOCKERHUB_USERNAME/spring-dashboard
    newTag: dev
replicas:
  - name: spring-dashboard
    count: 1
commonLabels:
  app.kubernetes.io/part-of: platform-poc
  app.kubernetes.io/environment: dev
