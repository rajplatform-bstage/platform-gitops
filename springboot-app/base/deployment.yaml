apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-dashboard
  labels:
    app.kubernetes.io/name: spring-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: spring-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spring-dashboard
    spec:
      containers:
        - name: spring-dashboard
          image: DOCKERHUB_USERNAME/spring-dashboard:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 768Mi
