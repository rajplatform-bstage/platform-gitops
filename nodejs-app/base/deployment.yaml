apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-js-app-1
  labels:
    app.kubernetes.io/name: node-js-app-1
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: node-js-app-1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: node-js-app-1
    spec:
      containers:
        - name: nodejs
          image: DOCKERHUB_USERNAME/node-js-app-1:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
